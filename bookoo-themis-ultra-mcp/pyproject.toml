[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bookoo-themis-ultra-mcp"
dynamic = ["version"]
description = "MCP server that lets AI assistants read and control a BOOKOO Themis Ultra scale over Bluetooth."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gustavo Pabon" }]
requires-python = ">=3.10"
dependencies = ["bleak>=3.0", "mcp>=2.3"]
keywords = ["mcp", "model-context-protocol", "bluetooth", "ble", "bookoo", "scale", "coffee"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Hardware",
]

[project.urls]
Homepage = "https://github.com/gustavo-pabon/mhs-pilot/tree/main/bookoo-themis-ultra-mcp"
Source = "https://github.com/gustavo-pabon/mhs-pilot"
Issues = "https://github.com/gustavo-pabon/mhs-pilot/issues"

[project.scripts]
bookoo-themis-ultra-mcp = "bookoo_themis_ultra_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.version]
path = "src/bookoo_themis_ultra_mcp/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
